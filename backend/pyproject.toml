[project]
name = "mindsim"
version = "0.1.0"
description = "Behavioral economics simulation engine"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.0",
    "rich>=13.0",
    "openai>=1.0",
    "tavily-python>=0.5",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.scripts]
mindsim = "mindsim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mindsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]

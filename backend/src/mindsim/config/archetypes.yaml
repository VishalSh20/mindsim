        mean: 0.28
        std: 0.10
        min: 0.05
        max: 0.5
    awareness:
      product: 0.02
      competitor_fraction: 0.10

# Loss aversion mixture model (Gächter et al. 2022)
# 80% from archetype distribution, 20% from near-zero subgroup
loss_aversion_mixture:
  archetype_weight: 0.80
  near_zero_weight: 0.20
  near_zero_mean: 1.1
  near_zero_std: 0.2

# Personality-economics correlations (from RESEARCH.md)
correlations:
  neuroticism_loss_aversion: 0.3    # Lauriola & Levin 2001
  openness_novelty: 0.3             # Nicholson et al. 2005
  agreeableness_social_proof: 0.4   # Empirical estimate

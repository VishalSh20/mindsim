        std: 0.12
        min: 0.1
        max: 0.7
      novelty_weight:
        mean: 0.65
        std: 0.15
        min: 0.2
        max: 1.0
      price_sensitivity:
        mean: 0.4
        std: 0.15
        min: 0.1
        max: 0.8
      fomo_susceptibility:
        mean: 0.6
        std: 0.15
        min: 0.2
        max: 0.9
      openness:

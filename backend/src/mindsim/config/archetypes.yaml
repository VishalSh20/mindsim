# Rogers (1962) Diffusion of Innovations archetypes
# Parameter distributions: mean, std for normal sampling
# All values grounded in RESEARCH.md sources

archetypes:
  innovator:
    share: 0.025
    label: "Innovator"
    description: "Technology enthusiasts, first to try new products"
    distributions:
      loss_aversion_lambda:
        mean: 1.5
        std: 0.3
        min: 1.0
        max: 2.5
      status_quo_bias:
        mean: 0.15
        std: 0.08
        min: 0.0
        max: 0.5
      social_proof_need:
        mean: 0.2
        std: 0.1
        min: 0.0
        max: 0.6
      novelty_weight:
        mean: 0.8
        std: 0.15
        min: 0.3
        max: 1.0
      price_sensitivity:
        mean: 0.3
        std: 0.15
        min: 0.0
        max: 0.8
      fomo_susceptibility:
        mean: 0.7
        std: 0.15
        min: 0.2
        max: 1.0
      openness:
        mean: 0.78
        std: 0.10
        min: 0.4
        max: 1.0
    awareness:
      product: 0.90
      competitor_fraction: 0.90

  early_adopter:
